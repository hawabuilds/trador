# The price refresher, as a second Railway service.
#
# Vercel's cron is limited to a couple of jobs on the hobby plan and cannot run
# more often than daily there, which is useless for prices. This hits the same
# routes on a real schedule.
#
# Discovery is not in here: the worker service above already sweeps on its own
# loop, and this endpoint defers to it via the heartbeat.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run cron"
restartPolicyType = "ON_FAILURE"
cronSchedule = "*/5 * * * *"
